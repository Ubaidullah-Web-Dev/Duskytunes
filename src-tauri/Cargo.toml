[package]
name = "duskytunes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Duskytunes — Dusky desktop music client"
rust-version = "1.80"

[[bin]]
name = "duskytunes"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = ["webview-data-url", "tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
urlencoding = "2"

innertube = { path = "../crates/innertube" }
player = { path = "../crates/player" }
duskytunes-core = { workspace = true }
duskytunes-protocol = { workspace = true }
async-trait = { workspace = true }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
rand = { workspace = true }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
libc = "0.2"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

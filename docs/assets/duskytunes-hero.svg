<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Duskytunes — Music, shaped for Dusky</title>
  <desc id="desc">A restrained Dusky-inspired banner for the Duskytunes desktop music application.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1215"/>
      <stop offset="0.52" stop-color="#15191d"/>
      <stop offset="1" stop-color="#1a1d20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c27b5f"/>
      <stop offset="0.48" stop-color="#8c9f93"/>
      <stop offset="1" stop-color="#8b98aa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1400" height="430" rx="30" fill="url(#bg)"/>

  <g opacity="0.18" stroke="#73808a" stroke-width="1">
    <path d="M80 80H1320M80 145H1320M80 210H1320M80 275H1320M80 340H1320"/>
    <path d="M170 60V370M320 60V370M470 60V370M620 60V370M770 60V370M920 60V370M1070 60V370M1220 60V370"/>
  </g>

  <circle cx="1130" cy="210" r="145" fill="#c27b5f" opacity="0.07" filter="url(#soft)"/>
  <circle cx="1220" cy="145" r="110" fill="#8c9f93" opacity="0.07" filter="url(#soft)"/>
  <circle cx="1045" cy="305" r="120" fill="#8b98aa" opacity="0.07" filter="url(#soft)"/>

  <rect x="82" y="68" width="110" height="5" rx="2.5" fill="#c27b5f"/>
  <rect x="198" y="68" width="72" height="5" rx="2.5" fill="#8c9f93"/>
  <rect x="276" y="68" width="45" height="5" rx="2.5" fill="#8b98aa"/>

  <text x="82" y="116" fill="#8c9f93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">DUSKY // MUSIC</text>
  <text x="82" y="220" fill="#f1eee8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="760" letter-spacing="-4">DUSKYTUNES</text>
  <text x="87" y="274" fill="#b9bec3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="430">Music, shaped for the Dusky desktop.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.4">
    <rect x="84" y="317" width="162" height="37" rx="18.5" fill="#20252a" stroke="#3b4249"/>
    <text x="108" y="341" fill="#d8d5cf">NATIVE AUDIO</text>

    <rect x="258" y="317" width="164" height="37" rx="18.5" fill="#20252a" stroke="#3b4249"/>
    <text x="282" y="341" fill="#d8d5cf">LIVE THEMING</text>

    <rect x="434" y="317" width="216" height="37" rx="18.5" fill="#20252a" stroke="#3b4249"/>
    <text x="458" y="341" fill="#d8d5cf">WEBKIT HIBERNATION</text>
  </g>

  <g transform="translate(1010 96)">
    <rect width="265" height="238" rx="26" fill="#15191d" stroke="#3a4147"/>
    <rect x="24" y="24" width="78" height="78" rx="18" fill="#20262a"/>
    <circle cx="63" cy="63" r="24" fill="none" stroke="url(#accent)" stroke-width="7"/>
    <circle cx="63" cy="63" r="6" fill="#f1eee8"/>
    <path d="M64 40V60L82 70" fill="none" stroke="#f1eee8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="24" y="135" fill="#f1eee8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">PLAYBACK LIVES ON</text>
    <text x="24" y="162" fill="#8c9f93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">UI MAY DISAPPEAR</text>

    <line x1="24" y1="189" x2="241" y2="189" stroke="#343b41"/>
    <circle cx="54" cy="214" r="8" fill="#c27b5f"/>
    <line x1="75" y1="214" x2="214" y2="214" stroke="#8996a8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

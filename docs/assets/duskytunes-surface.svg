<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Illustrated Duskytunes v2.3 Home surface</title>
<desc id="desc">A vector artwork based on Duskytunes Home, showing navigation, a listening console, artist cards and the bottom player.</desc>
<defs>
  <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12161a"/>
    <stop offset="1" stop-color="#1a1e22"/>
  </linearGradient>
  <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8f4636"/>
    <stop offset="0.55" stop-color="#bd6d4e"/>
    <stop offset="1" stop-color="#28282e"/>
  </linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#46534d"/>
    <stop offset="1" stop-color="#252b29"/>
  </linearGradient>
</defs>

<rect width="1400" height="760" rx="30" fill="#0b0d0f"/>
<rect x="28" y="28" width="1344" height="704" rx="22" fill="url(#window)" stroke="#343b41"/>

<!-- titlebar -->
<rect x="28" y="28" width="1344" height="54" rx="22" fill="#171b1e"/>
<rect x="28" y="60" width="1344" height="22" fill="#171b1e"/>
<circle cx="58" cy="55" r="6" fill="#c27b5f"/>
<circle cx="79" cy="55" r="6" fill="#8c9f93"/>
<circle cx="100" cy="55" r="6" fill="#8996a8"/>
<text x="127" y="61" fill="#b9bec3" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">DUSKYTUNES</text>
<text x="1250" y="61" fill="#6f787f" font-family="ui-monospace,monospace" font-size="12">DUSKY // MUSIC</text>

<!-- sidebar -->
<rect x="28" y="82" width="226" height="576" fill="#151a1c"/>
<line x1="254" y1="82" x2="254" y2="658" stroke="#343b41"/>
<text x="56" y="126" fill="#f1eee8" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Duskytunes</text>
<text x="56" y="167" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">LISTEN</text>

<g font-family="system-ui,sans-serif" font-size="15">
  <rect x="45" y="186" width="192" height="38" rx="8" fill="#242b2d"/>
  <circle cx="64" cy="205" r="6" fill="#c27b5f"/>
  <text x="83" y="211" fill="#f1eee8">Home</text>

  <circle cx="64" cy="252" r="6" fill="#657078"/>
  <text x="83" y="258" fill="#aeb5ba">Search</text>

  <circle cx="64" cy="299" r="6" fill="#657078"/>
  <text x="83" y="305" fill="#aeb5ba">Library</text>
</g>

<text x="56" y="357" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">PLAYLISTS</text>
<g fill="#8d969c" font-family="system-ui,sans-serif" font-size="13">
  <text x="56" y="393">Liked music</text>
  <text x="56" y="424">Night drive</text>
  <text x="56" y="455">On repeat</text>
</g>

<rect x="48" y="568" width="184" height="62" rx="12" fill="#1f2528" stroke="#323a3f"/>
<circle cx="72" cy="599" r="14" fill="url(#art)"/>
<text x="96" y="595" fill="#d8d5cf" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Follow System</text>
<text x="96" y="613" fill="#73808a" font-family="system-ui,sans-serif" font-size="10">Dusky palette live</text>

<!-- main content -->
<text x="294" y="134" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">HOME / 08:44</text>
<text x="294" y="180" fill="#f2efe9" font-family="system-ui,sans-serif" font-size="42" font-weight="760">Good morning</text>
<text x="294" y="207" fill="#8c949a" font-family="system-ui,sans-serif" font-size="14">Your listening console, shaped by what is already playing.</text>

<!-- listening console -->
<rect x="294" y="240" width="1016" height="184" rx="18" fill="#1a1f22" stroke="#343b41"/>
<rect x="315" y="261" width="142" height="142" rx="14" fill="url(#art)"/>

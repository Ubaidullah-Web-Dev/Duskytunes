  <text x="646" y="540" fill="#f1eee8" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Kendrick Lamar</text>
  <text x="646" y="566" fill="#8d969c" font-family="system-ui,sans-serif" font-size="12">in rotation</text>

  <rect x="802" y="497" width="236" height="128" rx="14" fill="#211f20" stroke="#343b41"/>
  <circle cx="852" cy="548" r="32" fill="#75594b"/>
  <text x="900" y="540" fill="#f1eee8" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Your mix</text>
  <text x="900" y="566" fill="#8d969c" font-family="system-ui,sans-serif" font-size="12">continue listening</text>

  <rect x="1056" y="497" width="254" height="128" rx="14" fill="#1d2226" stroke="#343b41"/>
  <text x="1082" y="532" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.4">DUSKY THEME</text>
  <text x="1082" y="562" fill="#f1eee8" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Follow System</text>
  <rect x="1082" y="583" width="34" height="6" rx="3" fill="#c27b5f"/>
  <rect x="1123" y="583" width="34" height="6" rx="3" fill="#8c9f93"/>
  <rect x="1164" y="583" width="34" height="6" rx="3" fill="#8996a8"/>
</g>

<!-- bottom player -->
<rect x="28" y="658" width="1344" height="74" rx="0" fill="#131719"/>

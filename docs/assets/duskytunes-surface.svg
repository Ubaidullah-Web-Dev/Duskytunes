<text x="487" y="356" fill="#9da5aa" font-family="system-ui,sans-serif" font-size="15">Kendrick Lamar</text>

<rect x="487" y="381" width="84" height="28" rx="14" fill="#c27b5f"/>
<text x="514" y="400" fill="#17191b" font-family="system-ui,sans-serif" font-size="11" font-weight="800">PAUSE</text>
<rect x="580" y="381" width="84" height="28" rx="14" fill="#23292d" stroke="#434b51"/>
<text x="607" y="400" fill="#cbd0d3" font-family="system-ui,sans-serif" font-size="11" font-weight="700">QUEUE</text>

<line x1="708" y1="303" x2="708" y2="390" stroke="#343b41"/>
<text x="741" y="312" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="11">SESSION</text>
<text x="741" y="345" fill="#d4d8da" font-family="system-ui,sans-serif" font-size="14">native libmpv</text>
<text x="741" y="370" fill="#d4d8da" font-family="system-ui,sans-serif" font-size="14">MPRIS connected</text>
<text x="741" y="395" fill="#d4d8da" font-family="system-ui,sans-serif" font-size="14">Dusky palette live</text>

<!-- familiar artists -->
<text x="294" y="475" fill="#f1eee8" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Familiar artists</text>
<text x="1237" y="475" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="11">SEE ALL</text>


<text x="338" y="371" fill="#f7eee8" font-family="system-ui,sans-serif" font-size="14" font-weight="700">US</text>

<text x="487" y="282" fill="#8c9f93" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.6">NOW PLAYING</text>

name: Bug report
description: Something in Duskytunes is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it! A few environment details usually make Linux issues much faster to diagnose and fix.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you did, what you expected and what happened instead.
      placeholder: "After opening Duskytunes…"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Play …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Duskytunes version
      placeholder: "1.2.6"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distro, desktop/shell, display server and GPU if relevant.
      placeholder: "Dusky OS / Arch Linux, Hyprland/Wayland"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: Paste relevant output from duskytunes-diagnostics or attach a log.
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag screenshots or a short screen recording here when the issue is visual.

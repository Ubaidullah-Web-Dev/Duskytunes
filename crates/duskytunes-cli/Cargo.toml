[package]
name = "duskytunes-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Duskytunes daemon command-line client and launcher."

[[bin]]
name = "duskytunes-cli"
path = "src/main.rs"

[[bin]]
name = "duskytunes"
path = "src/launcher.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
duskytunes-protocol = { workspace = true }

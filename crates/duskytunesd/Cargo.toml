[package]
name = "duskytunesd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Duskytunes playback daemon"

[[bin]]
name = "duskytunesd"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "signal", "fs", "process"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
duskytunes-core = { workspace = true }
duskytunes-soundcloud = { path = "../soundcloud" }
duskytunes-tidal = { path = "../tidal" }
duskytunes-protocol = { workspace = true }
innertube = { path = "../innertube" }
player = { path = "../player" }
libc = "0.2"
parking_lot = "0.12"
gtk = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
urlencoding = "2"
javascriptcore = { package = "javascriptcore-rs", version = "1.1" }
url = "2"
base64 = "0.22"
ksni = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["std", "block-padding"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
lofty = "0.22.2"
libm = "0.2"
